[build-system]
requires = ["setuptools>=61.0", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "wccontrol"
description = "Python module/program to control Watts Clever switch"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.6"
keywords = ["rpi", "pi"]
dynamic = ["version"]
dependencies = [
  "rpi.gpio",
]

[[project.authors]]
name = "Mark Blakeney"
email = "mark.blakeney@bullet-systems.net"

[project.urls]
Homepage = "https://github.com/bulletmark/wccontrol"

[project.scripts]
wccontrol = "wccontrol:main"

[tool.setuptools_scm]
version_scheme = "post-release"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
ignore = ["SIM115", "SIM905", "BLE001", "PLW1510", "S110", "DTZ"]

